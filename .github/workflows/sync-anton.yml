name: Sync skills to Anton

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-anton-skills
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-actions
          hostname: gha-skills-${{ github.run_id }}

      - name: Trigger Arcane Git Sync
        env:
          ARCANE_WEBHOOK_TOKEN: ${{ secrets.ARCANE_WEBHOOK_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os, urllib.request
          url = 'http://raygun:3552/api/webhooks/trigger/' + os.environ['ARCANE_WEBHOOK_TOKEN']
          request = urllib.request.Request(url, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  print('Arcane Git Sync HTTP', response.status)
          except Exception:
              raise SystemExit('Arcane Git Sync failed or timed out; inspect Arcane before retrying.') from None
          PYCODE
