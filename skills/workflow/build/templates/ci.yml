# Minimal CI for a JS/TS project. Runs on every PR and on pushes to main.
# Steps whose package.json script doesn't exist are skipped (--if-present).
# Using pnpm or bun? Swap the setup and install lines as noted below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm: add `- uses: pnpm/action-setup@v4` above this step, set cache: pnpm
      # bun:  replace this step with `- uses: oven-sh/setup-bun@v2`
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci                                # pnpm install --frozen-lockfile / bun install --frozen-lockfile
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
