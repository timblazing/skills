<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenUI</title>
<style>/* OPENUI_STYLES */</style>
<style>
:root, :root[data-theme], :root.dark, :root.light {
  --openui-background: transparent;
  --openui-foreground: var(--color-background-primary, var(--card, #202024));
  --openui-text-neutral-primary: var(--color-text-primary, var(--foreground, #ededf0));
  --openui-text-neutral-secondary: var(--color-text-secondary, var(--muted-foreground, #b6b6bf));
  --openui-text-neutral-tertiary: var(--color-text-secondary, var(--muted-foreground, #b6b6bf));
  --openui-interactive-accent-default: var(--color-background-inverse, var(--primary, #ededf0));
  --openui-interactive-accent-hover: var(--color-background-secondary, var(--accent, #cacaD0));
  --openui-text-accent-primary: var(--color-text-inverse, var(--primary-foreground, #161618));
  --openui-border-default: var(--color-border-primary, var(--border, #44444c));
  --openui-border-interactive: var(--color-border-primary, var(--border, #44444c));
  --openui-highlight: var(--color-background-secondary, var(--secondary, #303036));
  --openui-font-body: var(--font-sans, system-ui);
  --openui-font-family: var(--font-sans, system-ui);
  --openui-font-heading: var(--font-sans, system-ui);
  --openui-font-label: var(--font-sans, system-ui);
  --openui-font-numbers: var(--font-sans, system-ui);
  --openui-text-body-default: 400 14px/1.5 var(--font-sans, system-ui);
  --openui-text-body-sm: 400 13px/1.5 var(--font-sans, system-ui);
  --openui-text-label-default: 400 14px/1.4 var(--font-sans, system-ui);
  --openui-font-weight-medium: 500;
  --openui-font-weight-heavy: 600;
  --openui-font-variation-regular: "wght" 400;
  --openui-font-variation-medium: "wght" 500;
  --openui-text-neutral-link: var(--openui-text-neutral-primary);
  --openui-popover-background: var(--openui-foreground);
}
html, body { margin: 0; padding: 0; background: transparent; color: var(--openui-text-neutral-primary); font-family: var(--font-sans, system-ui); }
* { box-sizing: border-box; }
#root { min-width: 0; font-size: 14px; line-height: 1.5; }
#root [class*="heading"], #root [class*="large-heavy"] { font-weight: 600; }
#root :not(pre):not(code) { font-family: var(--font-sans, system-ui); }
#root button, #root input { font: inherit; box-shadow: none; }
#root input { color: var(--openui-text-neutral-primary); }
#root[aria-busy="true"] { opacity: .65; }
#sharing { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--openui-border-default); }
#sharing button { min-height: 36px; padding: 6px 12px; border: 1px solid var(--openui-border-interactive); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
#sharing button:hover { background: var(--openui-highlight); }
button:disabled { opacity: .5; cursor: default !important; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--color-ring-primary, var(--ring, currentColor)); outline-offset: 3px; }
#sharing-status, #sharing summary { font-size: 13px; color: var(--openui-text-neutral-secondary); }
#sharing-status { margin: 8px 0; }
#sharing summary { cursor: pointer; }
#selection-preview { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 220px; overflow: auto; }
@media (max-width: 480px) { #root button, #root input, #sharing button { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
#status, #error { margin: 12px 0 0; font-size: 13px; }
#status { color: var(--color-text-secondary, var(--muted-foreground, #b6b6bf)); }
#error { color: var(--color-text-danger, var(--destructive, #ff8888)); white-space: pre-wrap; }
.openui-card { background: transparent !important; border: 0 !important; padding: 0 !important; box-shadow: none !important; }
</style>
</head>
<body>
<div id="root" data-ui><p>Connecting OpenUI to the conversation…</p></div>
<section id="sharing" aria-label="Selection context">
<button id="share" type="button" aria-pressed="false" disabled>Share selection</button>
<p id="sharing-status" role="status" aria-live="polite">Sharing is off.</p>
<details><summary>Selection details</summary><pre id="selection-preview"></pre></details>
</section>
<p id="status" role="status" aria-live="polite"></p>
<p id="error" role="alert" hidden></p>
<script>/* OPENUI_APP */</script>
</body>
</html>
